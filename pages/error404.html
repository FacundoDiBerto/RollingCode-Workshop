<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0;600;0,800;1,300&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
   <header class="sticky-top">
      <nav class="navbar navbar-expand-lg navbar-dark py-3">
        <div class="container">
          <a class="navbar-brand" href="../index.html">
            <img
              src="../assets/logo/logo-rolling-blanco.png"
              alt="Rolling Code School"
              class="nav-logo"
            />
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarNav"
          >
            <ul class="navbar-nav mb-2 mb-lg-0 gap-lg-4 align-items-lg-center">
              <li class="nav-item">
                <a class="nav-link" href="#speakers">Speakers</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#agenda">Agenda</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#como-llegar">Cómo llegar</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#sponsors">Sponsors</a>
              </li>
              <li class="nav-item">
                <a class="nav-link btn-comprar" href="#entradas"
                  >Comprar entrada</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="e404-main">
      <div class="container e404-wrapper">
        <div class="row align-items-center g-5">
          <div class="col-lg-6 d-flex justify-content-center">
            <img
              src="../assets/img/404imagen.jfif"
              alt="Ilustración de error"
              class="e404-illustration-img"
            />
          </div>

          <div class="col-lg-6">
            <div class="e404-card">
              <img
                src="../assets/img/404error.jfif"
                alt="Error 404"
                class="e404-number-img"
              />
              <h2 class="e404-title">
                Página <span class="e404-highlight">no encontrada</span>
              </h2>
              <p class="e404-text">
                Lo sentimos, la página que buscás no existe, fue eliminada o
                ocurrió un error.
              </p>
              <a href="../index.html" class="e404-btn">
                <i class="bi bi-arrow-left me-2"></i>Volver al inicio
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-5">
      <div
        class="container d-flex justify-content-between align-items-center flex-wrap gap-3"
      >
        <a href="../index.html" class="footer-logo">
          <img
            src="../assets/logo/logo-rolling-blanco.png"
            alt="Rolling Code School"
            class="footer-logo-img"
          />
        </a>
        <ul class="list-unstyled d-flex gap-3 mb-0">
          <li>
            <a
              href="https://www.instagram.com/rollingcodeschool?mdxt=MTh3NzBmNXNxamRtNQ=="
              target="_blank"
              class="social-icon link-txt"
            >
              <img src="assets/iconos/instagram.svg" alt="Instagram" />
            </a>
          </li>
          <li>
            <a
              href="https://www.facebook.com/share/1FWm1Rt2Vi/"
              target="_blank"
              class="social-icon link-txt"
            >
              <img src="assets/iconos/facebook.svg" alt="Facebook" />
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/school/rollingcodeschool/"
              target="_blank"
              class="social-icon link-txt"
            >
              <img src="assets/iconos/linkedin.svg" alt="LinkedIn" />
            </a>
          </li>
          <li>
            <a
              href="https://youtube.com/@rollingcode7175?si=DgPewfYJimZEykXt"
              target="_blank"
              class="social-icon link-txt"
            >
              <img src="assets/iconos/youtube.svg" alt="YouTube" />
            </a>
          </li>
          <li>
            <a
              href="https://x.com/rollingcodeok"
              target="_blank"
              class="social-icon link-txt"
            >
              <img src="assets/iconos/x.svg" alt="X" />
            </a>
          </li>
          <li>
            <a
              href="https://github.com/rollingcodestudio"
              target="_blank"
              class="social-icon link-txt"
            >
              <img src="assets/iconos/github.svg" alt="GitHub" />
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
