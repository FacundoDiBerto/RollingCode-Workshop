<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,300&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header></header>
  <main>
    <section class="py-5" id="entradas">
      <div class="container">

        <div class="mb-4">
          <span class="text-danger fw-bold text-uppercase ticket-subtitle d-block mb-1">ENTRADAS</span>
          <h2 class="h1 fw-bold text-white mb-0">Asegurá tu lugar antes de que suba el precio</h2>
        </div>

        <div class="countador-banner mb-4">
          <div class="row align-items-center gy-4">

            <div class="col-lg-5">
              <span class="contador-titulo d-block text-uppercase">EARLY BIRD</span>
              <h3 class="countdown-title">El precio especial termina<br>el 31/10</h3>
              <p class="countdown-subtitle">Después la entrada pasa de $25.000 a $35.000.</p>
            </div>

            <div class="col-lg-4 col-xl-3">
              <div class="contador-grid justify-content-start justify-content-lg-center">
                <div class="contador-item">
                  <div class="contador-numero">17</div>
                  <div class="contador-dia">DÍAS</div>
                </div>
                <div class="contador-item">
                  <div class="contador-numero">09</div>
                  <div class="contador-dia">HORAS</div>
                </div>
                <div class="contador-item">
                  <div class="contador-numero">24</div>
                  <div class="contador-dia">MIN</div>
                </div>
              </div>
            </div>
    </section>
  </main>
  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
