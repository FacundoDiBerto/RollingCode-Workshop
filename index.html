<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0;600;0,800;1,300&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <h1 class="navbar-brand">Rolling Code Workshop navbar</h1>
      </nav>
    </header>
    <main class="py-5">
      <div class="container d-flex justify-content-center">
        <div class="workshop-card shadow-lg w-100 p-4 p-lg-5">
          <div class="row align-items-center">
            <!-- COLUMNA IZQUIERDA -->
            <div class="col-lg-7 mb-5 mb-lg-0 pe-lg-5 text-content">
              <!-- Etiqueta superior -->
              <p class="workshop-label mb-3">
                <span class="fw-light fst-italic">WORKSHOP</span>
                <span class="fw-bolder">ENTRADAS LIMITADAS</span>
              </p>

              <!-- Título Principal -->
              <h1 class="main-title mb-4">
                ¿POR DÓNDE<br />
                EMPIEZO A<br />
                <span class="text-black">PROGRAMAR?</span>
              </h1>

              <!-- Párrafo -->
              <p class="main-paragraph mb-5">
                Una tarde con diez speakers de Rolling Code School para ordenar
                tus primeros pasos: qué aprender, cómo practicar y cómo mostrar
                lo que sabés.
              </p>

              <!-- Grupo de Botones -->
              <!-- Grupo de Botones (SIN la clase 'btn' de Bootstrap) -->
              <div class="d-flex flex-column flex-sm-row gap-3 buttons-group">
                <button class="btn-buy">Comprar entrada</button>
                <button class="btn-agenda">Ver agenda</button>
              </div>
            </div>
            <!-- FIN COLUMNA IZQUIERDA -->

            <!-- COLUMNA DERECHA -->
          </div>
        </div>
      </div>
    </main>
    <footer>
      <h1>Footer Content</h1>
    </footer>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
