<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0;600;0,800;1,300&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button
            class="btn-icon navbar-toggler"
            type="button"
            data-bs-toggle="drawer"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
          </button>
          <dialog
            class="drawer drawer-end"
            tabindex="-1"
            id="navbarNav"
            aria-labelledby="navbarNavLabel"
          >
            <div class="drawer-header">
              <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="drawer"
                aria-label="Close"
              ></button>
            </div>
            <div class="drawer-body">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#"
                    >Home</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Features</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Pricing</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
              </ul>
            </div>
          </dialog>
        </div>
      </nav>
    </header>
    <main class="py-5">
      <div class="container d-flex justify-content-center">
        <div
          class="workshop-card shadow-lg w-100 d-flex justify-content-center align-items-center"
        >
          <div class="row align-items-center">
            <div class="col-lg-7 mb-5 mb-lg-0 pe-lg-5 text-content">
              <!-- Etiqueta superior -->
              <p class="workshop-label mb-3">
                <span class="fw-light fst-italic">WORKSHOP</span>
                <span class="fw-bolder">ENTRADAS LIMITADAS</span>
              </p>

              <!-- Título Principal -->
              <h1 class="main-title mb-4">
                ¿POR DÓNDE<br />
                EMPIEZO A<br />
                <span class="text-black">PROGRAMAR?</span>
              </h1>

              <!-- Párrafo -->
              <p class="main-paragraph mb-5">
                Una tarde con diez speakers de Rolling Code School para ordenar
                tus primeros pasos: qué aprender, cómo practicar y cómo mostrar
                lo que sabés.
              </p>

              <!-- Grupo de Botones -->
              <div class="d-flex flex-column flex-sm-row gap-3 buttons-group">
                <button class="btn btn-buy">Comprar entrada</button>
                <button class="btn btn-agenda">Ver agenda</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <h1>Footer Content</h1>
    </footer>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
